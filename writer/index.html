<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/writer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- WASM support headers for Drift database -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="writer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>writer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Mobile browsers sometimes lose the WebGL surface (CanvasKit) after the tab/app is
    // backgrounded, resulting in a black screen until reload. Nudging a resize on resume
    // is a low-impact way to trigger a redraw.
    (function () {
      function nudge() {
        // Trigger Flutter's resize handling.
        window.dispatchEvent(new Event('resize'));
      }

      // If the WebGL context is lost (CanvasKit), the safest recovery is a reload.
      // Use a *capturing* listener so we don't depend on finding the right canvas.
      var reloadScheduled = false;
      function scheduleReload(reason) {
        if (reloadScheduled) return;
        reloadScheduled = true;
        // Small delay to allow logs to flush.
        setTimeout(function () {
          try {
            console.warn("[writer] Reloading after:", reason);
          } catch (_) {}
          location.reload();
        }, 80);
      }

      document.addEventListener(
        "webglcontextlost",
        function (e) {
          try {
            // Prevent the browser default, then reload to recover.
            e.preventDefault();
          } catch (_) {}
          scheduleReload("webglcontextlost");
        },
        true
      );

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          setTimeout(nudge, 50);
        }
      });

      window.addEventListener('pageshow', function () {
        setTimeout(nudge, 50);
      });

      window.addEventListener('focus', function () {
        setTimeout(nudge, 50);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
