<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/writer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- WASM support headers for Drift database -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="writer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>writer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Mobile browsers may lose WebGL context after backgrounding. Keep render-loop control
    // here so behavior is centralized and we don't duplicate Flutter/WebGL init logic.
    (function () {
      var isContextLost = false;
      var isPageHidden = false;
      var lastRafCallback = null;
      var observedCanvases = new WeakSet();
      var activeGlContext = null;
      var originalRequestAnimationFrame =
        window.requestAnimationFrame.bind(window);

      function nudge() {
        // Trigger Flutter resize/layout pass.
        window.dispatchEvent(new Event('resize'));
      }

      function shouldPauseRendering() {
        if (isContextLost || isPageHidden) return true;
        if (activeGlContext && activeGlContext.isContextLost()) return true;
        return false;
      }

      function restartRenderLoopIfNeeded() {
        if (shouldPauseRendering()) return;
        if (!lastRafCallback) return;
        var callback = lastRafCallback;
        lastRafCallback = null;
        originalRequestAnimationFrame(callback);
      }

      function refreshGlContextHandle(canvas) {
        // Context handle must be reacquired after restore before resource recreation.
        // Resource recreation itself remains owned by Flutter/engine.
        activeGlContext =
          canvas.getContext('webgl2') ||
          canvas.getContext('webgl') ||
          canvas.getContext('experimental-webgl');
      }

      function onContextLost(event) {
        event.preventDefault();
        isContextLost = true;
      }

      function onContextRestored(event) {
        isContextLost = false;
        refreshGlContextHandle(event.target);
        setTimeout(nudge, 50);
        restartRenderLoopIfNeeded();
      }

      function attachWebGlLifecycle(canvas) {
        if (!(canvas instanceof HTMLCanvasElement)) return;
        if (observedCanvases.has(canvas)) return;
        observedCanvases.add(canvas);
        canvas.addEventListener('webglcontextlost', onContextLost, false);
        canvas.addEventListener('webglcontextrestored', onContextRestored, false);
        refreshGlContextHandle(canvas);
      }

      window.requestAnimationFrame = function (callback) {
        return originalRequestAnimationFrame(function (time) {
          // Guard loop work while hidden/lost.
          if (shouldPauseRendering()) {
            lastRafCallback = callback;
            return;
          }
          callback(time);
        });
      };

      function attachExistingCanvases() {
        document.querySelectorAll('canvas').forEach(attachWebGlLifecycle);
      }

      var observer = new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var mutation = mutations[i];
          for (var j = 0; j < mutation.addedNodes.length; j++) {
            var node = mutation.addedNodes[j];
            if (!(node instanceof Element)) continue;
            if (node.tagName === 'CANVAS') attachWebGlLifecycle(node);
            node.querySelectorAll &&
              node.querySelectorAll('canvas').forEach(attachWebGlLifecycle);
          }
        }
      });
      observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
      attachExistingCanvases();

      document.addEventListener('visibilitychange', function () {
        isPageHidden = document.hidden;
        if (isPageHidden) return;
        if (!isContextLost) {
          setTimeout(nudge, 50);
          restartRenderLoopIfNeeded();
        }
      });

      window.addEventListener('pageshow', function () {
        isPageHidden = false;
        attachExistingCanvases();
        setTimeout(nudge, 50);
        restartRenderLoopIfNeeded();
      });

      window.addEventListener('focus', function () {
        isPageHidden = false;
        attachExistingCanvases();
        setTimeout(nudge, 50);
        restartRenderLoopIfNeeded();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
